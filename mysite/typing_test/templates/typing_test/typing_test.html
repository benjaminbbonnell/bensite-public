        color: red;
    }
    .cursor {
        display: inline-block;
        width: 2px;
        height: 1.2em;
        position: absolute;
        background-color: white;
        animation: blink 1s infinite;
        margin-right: -2px;  /* This prevents it from pushing characters */
    }

@keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
}
</style>

//-1 incorrect, 0 untyped, 1 correct
//returns an array of arrays indicating if letter in word is correct or not

function checkWord(typed_words_array, test_words_array, current_word_number, current_word_position) {
    let result_array = [];

    //handle typed words
    for (let i=0; i < typed_words_array.length; i++) {
        let test_word = test_words_array[i];
        let typed_word = typed_words_array[i];

        let test_word_len = test_words_array[i].length;
        let typed_word_len = typed_words_array[i].length;
        let max_word_array_len = Math.max(test_word_len, typed_word_len);

        let word_result_array = [];

        for (let j=0; j<max_word_array_len; j++) {
            if (j >= test_word_len) {
                word_result_array.push(-1);
            }
            else if (j >= typed_word_len) {
                word_result_array.push(-1);
            }
            else if (test_word[j] == typed_word[j]) {
                word_result_array.push(1);
            }
            else if (test_word[j] != typed_word[j]) {
                word_result_array.push(-1);
            }
        }
        result_array.push(word_result_array);
    }

    //handle current words

    let current_word_result_array = [];

    let curr_test_word = test_words_array[current_word_number];
    let curr_typed_word = current_typed_word;

    let curr_test_word_len = curr_test_word.length;
    let curr_typed_word_len = curr_typed_word.length;

    let max_curr_word_array_len = Math.max(curr_test_word.length, curr_typed_word.length);

    for (let i=0; i<max_curr_word_array_len; i++) {
            if (i >= curr_test_word_len) {
                current_word_result_array.push(-1);
            }
            else if (i >= curr_typed_word_len) {
                current_word_result_array.push(0);
            }
            else if (curr_test_word[i] == curr_typed_word[i]) {
                current_word_result_array.push(1);
            }
            else if (curr_test_word[i] != curr_typed_word[i]) {
                current_word_result_array.push(-1);
            }
        }
    result_array.push(current_word_result_array);

    //handle untyped words
    for (let i=current_word_number+1; i<test_words_array.length; i++) {
        let test_word = test_words_array[i];

        let word_result_array = [];

        for (let j=0; j<test_word.length; j++) {
            word_result_array.push(0);
        }
        result_array.push(word_result_array);
    }

    return result_array;
}

    result_string = "";

    const isAlphanumeric = /^[a-zA-Z0-9]$/.test(event.key);

    if (event.key === " " && current_word_char_index != 0) {
        completed_words.push(current_typed_word)
        current_word_index += 1;
        current_word_char_index = 0;
        current_typed_word = ""
    }

    if (isAlphanumeric) {
        current_typed_word += event.key
        current_word_char_index += 1;
    }

    if(event.key == "Backspace" && current_word_char_index != 0) {
        current_typed_word = current_typed_word.slice(0, -1);
        current_word_char_index -= 1;
    }
