openapi: 3.0.3
info:
  title: Weather API
  version: 0.2.0
  description: A collection of APIs to get data from benjaminbbonnell.com/weather/api
paths:
  /weather/api/hb/:
    get:
      operationId: get_hours_before
      description: Retrieve weather forecast accuracy data grouped by API name and
        hours before forecast.
      parameters:
      - in: query
        name: api_name
        schema:
          type: array
          items:
            type: string
        description: 'Filter results by API name(s). Use multiple times for multiple
          values: ?api_name=openmeteo&api_name=tomorrowio'
        explode: true
        style: form
        examples:
          All:
            value: ''
          OpenMeteoOnly:
            value: openmeteo
            summary: OpenMeteo only
          OpenMeteoAndTomorrowIO:
            value:
            - openmeteo
            - tomorrowio
            summary: OpenMeteo and TomorrowIO
      - in: query
        name: hoursbefore
        schema:
          type: integer
        description: Filter results to forecasts with hours less than or equal to
          this value.
        examples:
          All:
            value: ''
          24Hours:
            value: 24
            summary: 24 hours
          72Hours:
            value: 72
            summary: 72 hours
      tags:
      - Weather Analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HoursBeforeResponse'
              examples:
                SuccessfulExampleOfHoursBeforeData:
                  value:
                  - - api_name: openmeteo
                      hours_before:
                        '0': 0
                        '1': 0.89
                        '2': 1.08
                        '3': 1.22
                        '4': 1.34
                        '5': 1.44
                  summary: Successful Example of Hours Before Data
          description: ''
  /weather/api/locations/:
    get:
      operationId: get_location_list
      description: Retrieve a list of locations with their ID, name, state, country,
        latitude, and longitude.
      tags:
      - Forecasts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationResponse'
              examples:
                SuccessfulExampleOfLocationData:
                  value:
                  - - city_id: 1
                      city_name: Washington
                      state_code: DC
                      country_code: USA
                      latitude: 38.9072
                      longitude: -77.0369
                    - city_id: 2
                      city_name: Dallas
                      state_code: TX
                      country_code: USA
                      latitude: 32.7767
                      longitude: -96.797
                  summary: Successful Example of Location Data
          description: ''
  /weather/api/ma/:
    get:
      operationId: get_monthly_average
      description: Retrieve weather forecast accuracy data grouped by API name, month,
        and hours before forecast.
      parameters:
      - in: query
        name: api_name
        schema:
          type: array
          items:
            type: string
        description: 'Filter results by API name(s). Use multiple times for multiple
          values: ?api_name=openmeteo&api_name=tomorrowio'
        explode: true
        style: form
        examples:
          All:
            value: ''
          OpenMeteoOnly:
            value: openmeteo
            summary: OpenMeteo only
          OpenMeteoAndTomorrowIO:
            value:
            - openmeteo
            - tomorrowio
            summary: OpenMeteo and TomorrowIO
      - in: query
        name: hoursbefore
        schema:
          type: integer
        description: Filter results to forecasts with hours less than or equal to
          this value.
        examples:
          All:
            value: ''
          1Hour:
            value: 1
            summary: 1 hour
          12Hours:
            value: 12
            summary: 12 hours
      - in: query
        name: month
        schema:
          type: array
          items:
            type: string
        description: 'Filter results by month integer. Use multiple times for multiple
          values: ?month=1&month=4'
        explode: true
        style: form
        examples:
          All:
            value: ''
          November:
            value: '11'
          December:
            value: '12'
      tags:
      - Weather Analysis
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyAverageResponse'
              examples:
                SuccessfulExampleOfMonthlyAverageData:
                  value:
                  - - api_name: openmeteo
                      months:
                        January:
                          '1': 0.63
                          '6': 1.49
                          '12': 1.87
                          '24': 2.24
                        February:
                          '1': 0.71
                          '6': 1.76
                          '12': 2.28
                          '24': 3.08
                  summary: Successful Example of Monthly Average Data
          description: ''
  /weather/api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
