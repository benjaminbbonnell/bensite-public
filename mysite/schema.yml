          - zh-hant
      tags:
      - schema
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    HoursBeforeResponse:
      type: object
      properties:
        api_name:
          type: string
        hours_before:
          type: object
          additionalProperties: {}
      required:
      - api_name
      - hours_before
    LocationResponse:
      type: object
      properties:
        city_id:
          type: integer
        city_name:
          type: string
        state_code:
          type: string
        country_code:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
      - city_id
      - city_name
      - country_code
      - latitude
      - longitude
      - state_code
    MonthlyAverageResponse:
      type: object
      properties:
        api_name:
          type: string
        months:
          type: object
          additionalProperties: {}
      required:
      - api_name
      - months
